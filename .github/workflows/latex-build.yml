name: LaTeX Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set default Git branch name
      run: git config --global init.defaultBranch main

    - uses: actions/checkout@v7

    - name: Compile LaTeX documents
      uses: xu-cheng/latex-action@v3
      with:
        root_file: |
          main.tex
          rebuttal.tex

    - name: Check for LaTeX errors and warnings
      run: |
        status=0
        for doc in main rebuttal; do
          if grep -q "^!" "$doc.log"; then
            echo "LaTeX errors found in $doc.tex:"
            grep "^!" "$doc.log"
            status=1
          elif grep -q "Warning:" "$doc.log"; then
            echo "LaTeX warnings found in $doc.tex:"
            grep "Warning:" "$doc.log"
            echo "Build of $doc.tex completed with warnings."
          else
            echo "LaTeX build of $doc.tex completed successfully without errors or warnings."
          fi
        done
        exit $status

    - name: Upload main PDF
      uses: actions/upload-artifact@v7
      with:
        name: main.pdf
        path: main.pdf

    - name: Upload rebuttal PDF
      uses: actions/upload-artifact@v7
      with:
        name: rebuttal.pdf
        path: rebuttal.pdf
